paths:
  /webhooks/twilio:
    post:
      tags:
        - Webhooks
      summary: Twilio SMS webhook
      description: Receives inbound SMS from Twilio. Handles keyword routing, STOP/HELP compliance.
      operationId: handleTwilioWebhook
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                From:
                  type: string
                  description: Phone number (E.164)
                Body:
                  type: string
                  description: Message body (keyword)
      responses:
        '200':
          description: TwiML response
          content:
            application/xml:
              schema:
                type: string
        '401':
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: '../../components/schemas.yaml#/components/schemas/ErrorResponse'

  /webhooks/relay:
    post:
      tags:
        - Webhooks
      summary: Relay Connect Hub webhook fanout
      description: Receives relay-forwarded Square events (HMAC via x-connect-signature).
      operationId: handleRelayWebhook
      parameters:
        - in: header
          name: x-connect-signature
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
        '401':
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: '../../components/schemas.yaml#/components/schemas/ErrorResponse'
