paths:
  /webhooks/twilio:
    post:
      tags:
        - Webhooks
      summary: Twilio SMS webhook
      description: |
        Receives inbound SMS from Twilio through the Noctusoft relay. Handles keyword routing and STOP/START/HELP compliance.
        When owner text commands are turned on, a `LINK <code>` text links the sending phone to an owner login,
        STOP pauses a linked phone and START turns it back on. A linked phone can also text MENU, LIVE, GAMES,
        ATTACH, UNDO, UNLINK and ACCOUNT, and answer a numbered question with a digit; YES during an open question
        gets a hint to reply with the number. A text is acted on as an owner text only when the relay reports that
        Twilio signed it and it comes from a phone an owner login has proven. A single word that is a real game
        keyword still goes to keyword routing. Every other text goes to keyword routing as before. Every answer is
        the TwiML in this response; nothing is sent separately.
      operationId: handleTwilioWebhook
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                From:
                  type: string
                  description: Phone number (E.164)
                Body:
                  type: string
                  description: Message body (a game keyword, a compliance word, `LINK <code>`, or an owner text command)
                MessageSid:
                  type: string
                  description: Twilio's id for the text. A text delivered twice is acted on once.
                OptOutType:
                  type: string
                  description: Set by Twilio when it has already treated the text as STOP, START or HELP
      responses:
        '200':
          description: TwiML response
          content:
            application/xml:
              schema:
                type: string
        '401':
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: '../../components/schemas.yaml#/components/schemas/ErrorResponse'

  /webhooks/marketplace:
    post:
      tags:
        - Webhooks
      summary: Noctusoft store marketplace webhook (event v1)
      description: Receives marketplace.* and seller.* events with x-noctusoft-signature and x-connect-signature headers.
      operationId: handleMarketplaceWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                data:
                  type: object
      responses:
        '200':
          description: Webhook processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
        '401':
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: '../../components/schemas.yaml#/components/schemas/ErrorResponse'
