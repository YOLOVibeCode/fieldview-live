paths:
  /owners/me:
    get:
      tags:
        - Owners
      summary: Get current owner account
      description: Returns authenticated owner account information
      operationId: getOwnerAccount
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Owner account
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '../../components/responses.yaml#/components/responses/Unauthorized'

  /owners/me/games:
    get:
      tags:
        - Owners
      summary: List owner games
      description: Returns list of games for authenticated owner
      operationId: listOwnerGames
      security:
        - BearerAuth: []
      parameters:
        - $ref: '../../components/parameters.yaml#/components/parameters/Page'
        - $ref: '../../components/parameters.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: List of games
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas.yaml#/components/schemas/Game'
                  pagination:
                    type: object
        '401':
          $ref: '../../components/responses.yaml#/components/responses/Unauthorized'

  /owners/me/games/{gameId}/audience:
    get:
      tags:
        - Owners
      summary: Get game audience
      description: Returns purchasers and watchers for a game. **Emails are masked** for privacy (e.g., j***@example.com)
      operationId: getGameAudience
      security:
        - BearerAuth: []
      parameters:
        - $ref: '../../components/parameters.yaml#/components/parameters/GameId'
      responses:
        '200':
          description: Game audience
          content:
            application/json:
              schema:
                type: object
                properties:
                  gameId:
                    type: string
                    format: uuid
                  purchasers:
                    type: array
                    items:
                      type: object
                      properties:
                        purchaseId:
                          type: string
                          format: uuid
                        emailMasked:
                          type: string
                          description: Masked email (e.g., j***@example.com)
                        purchasedAt:
                          type: string
                          format: date-time
                        amountCents:
                          type: integer
                        watched:
                          type: boolean
                  watchers:
                    type: array
                    items:
                      type: object
                      properties:
                        purchaseId:
                          type: string
                          format: uuid
                        emailMasked:
                          type: string
                        sessionCount:
                          type: integer
                        lastWatchedAt:
                          type: string
                          format: date-time
                  purchaseToWatchConversionRate:
                    type: number
                    minimum: 0
                    maximum: 1
        '401':
          $ref: '../../components/responses.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../components/responses.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../components/responses.yaml#/components/responses/NotFound'

  /owners/me/text-commands:
    get:
      tags:
        - Owners
      summary: Get text commands status
      description: |
        Says whether text commands are turned on for this account and lists this login's phones: its own and its helpers'.
        The phones belong to the login, not to the account. Phone numbers are masked and a code is never returned.
        When the feature is off for the account, the answer has `enabled: false` and no phones.
      operationId: getOwnerTextCommands
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Text commands status
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/CoachTextStatus'
        '401':
          description: Not signed in, or the login behind the token was removed or turned off
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Owners
      summary: Change the time zone for text commands
      description: Sets the time zone used to read and show times for this login's text commands.
      operationId: updateOwnerTextCommands
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/UpdateCoachTextSettingsRequest'
      responses:
        '200':
          description: Text commands status after the change
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/CoachTextStatus'
        '400':
          description: Missing or unknown time zone
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in, or the login behind the token was removed or turned off
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Text commands are not turned on for this account
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'

  /owners/me/text-commands/phones:
    post:
      tags:
        - Owners
      summary: Add a phone and make its code
      description: |
        Adds a named US or Canadian mobile number to this login's list (up to ten) and makes its six-digit code.
        The person texts `LINK <code>` from that phone to the product number to link it; that text is their opt-in.
        The code is returned this once, is stored only as a hash and lasts ten minutes unless configured otherwise.
        A number still waiting gets a fresh code on the same row. Whether another account uses the number is never
        shown, and nothing changes for that account. Codes are limited to ten per account in 15 minutes.
      operationId: addOwnerTextCommandsPhone
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/components/schemas/AddCoachTextPhoneRequest'
      responses:
        '201':
          description: The phone's id and its code
          headers:
            Cache-Control:
              description: Always `no-store`, so nothing between the API and the browser keeps the code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/CoachTextPhoneCode'
        '400':
          description: Missing name or number, a number outside the US and Canada, or the product number itself
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in, or the login behind the token was removed or turned off
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Text commands are not turned on for this account
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'
        '409':
          description: '`PHONE_ALREADY_ADDED` (the number is already linked on this login) or `PHONE_LIMIT_REACHED` (ten phones)'
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'
        '429':
          description: More than ten codes for this account in 15 minutes
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'

  /owners/me/text-commands/phones/{phoneId}/code:
    post:
      tags:
        - Owners
      summary: Make a new code for a phone
      description: A new code for a phone still waiting for its `LINK` text, or one that went unused too long. Counts toward the same limit as adding a phone.
      operationId: newOwnerTextCommandsPhoneCode
      security:
        - BearerAuth: []
      parameters:
        - name: phoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The phone's id and its new code
          headers:
            Cache-Control:
              description: Always `no-store`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/CoachTextPhoneCode'
        '400':
          description: The id is not a phone id
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in, or the login behind the token was removed or turned off
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Text commands are not turned on for this account
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Not a phone on this login's list
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'
        '409':
          description: '`PHONE_ALREADY_LINKED`: the phone is linked or paused'
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'
        '429':
          description: More than ten codes for this account in 15 minutes
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'

  /owners/me/text-commands/phones/{phoneId}:
    delete:
      tags:
        - Owners
      summary: Remove a phone
      description: |
        Takes one phone off this login's list, waiting or linked. The phone's opt-in is revoked only when no other
        account still has it. It works even when text commands are turned off, so a phone can always be removed.
      operationId: removeOwnerTextCommandsPhone
      security:
        - BearerAuth: []
      parameters:
        - name: phoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The phone was removed
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/CoachTextPhoneRemoved'
        '400':
          description: The id is not a phone id
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in, or the login behind the token was removed or turned off
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Not a phone on this login's list
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'

  /owners/me/text-commands/history:
    get:
      tags:
        - Owners
      summary: List recent texts
      description: Returns this login's most recent texts, newest first, with what came of each.
      operationId: listOwnerTextCommandsHistory
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: How many texts to return
      responses:
        '200':
          description: Recent texts
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/CoachTextHistory'
        '400':
          description: Limit out of range
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in, or the login behind the token was removed or turned off
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Text commands are not turned on for this account
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/ErrorResponse'
