components:
  schemas:
    # Viewer Identity (Email Required)
    ViewerIdentity:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Required for viewer identity and monitoring
        phoneE164:
          type: string
          pattern: '^\+[1-9]\d{1,14}$'
          description: Optional, E.164 format
        smsOptOut:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time

    # Stream Source (New - supports any media stream)
    StreamSource:
      type: object
      required:
        - type
        - gameId
        - protectionLevel
      properties:
        id:
          type: string
          format: uuid
        gameId:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - mux_managed
            - byo_hls
            - byo_rtmp
            - external_embed
        protectionLevel:
          type: string
          enum:
            - strong
            - moderate
            - best_effort
          description: Protection guarantee level
        muxAssetId:
          type: string
          description: For mux_managed type
        muxPlaybackId:
          type: string
          description: For mux_managed type
        hlsManifestUrl:
          type: string
          format: uri
          description: For byo_hls type
        rtmpPublishUrl:
          type: string
          format: uri
          description: For byo_rtmp type
        externalEmbedUrl:
          type: string
          format: uri
          description: For external_embed type (YouTube/Twitch/Vimeo)
        externalProvider:
          type: string
          enum:
            - youtube
            - twitch
            - vimeo
            - other
          description: For external_embed type
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Game
    Game:
      type: object
      required:
        - id
        - ownerAccountId
        - title
        - homeTeam
        - awayTeam
        - startsAt
        - priceCents
        - currency
        - state
        - keywordCode
      properties:
        id:
          type: string
          format: uuid
        ownerAccountId:
          type: string
          format: uuid
        title:
          type: string
        homeTeam:
          type: string
        awayTeam:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        state:
          type: string
          enum:
            - draft
            - active
            - live
            - ended
            - cancelled
        priceCents:
          type: integer
          minimum: 0
        currency:
          type: string
          default: USD
        keywordCode:
          type: string
        qrUrl:
          type: string
          format: uri
        streamSourceId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Purchase
    Purchase:
      type: object
      required:
        - id
        - gameId
        - viewerId
        - amountCents
        - currency
        - status
      properties:
        id:
          type: string
          format: uuid
        gameId:
          type: string
          format: uuid
        viewerId:
          type: string
          format: uuid
        amountCents:
          type: integer
        currency:
          type: string
        platformFeeCents:
          type: integer
        processorFeeCents:
          type: integer
        ownerNetCents:
          type: integer
        status:
          type: string
          enum:
            - created
            - paid
            - failed
            - refunded
            - partially_refunded
        paymentProviderPaymentId:
          type: string
        createdAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time

    # Checkout Request (Email Required)
    CheckoutCreateRequest:
      type: object
      required:
        - viewerEmail
      properties:
        viewerEmail:
          type: string
          format: email
          description: Required for viewer identity and monitoring
        viewerPhone:
          type: string
          description: Optional; normalized to E.164 on the server (default region US)
        smsOptIn:
          type: boolean
          description: >-
            Required to record SMS consent when viewerPhone is provided. Must be true to
            receive game alerts, score updates, and payment links via SMS.
        returnUrl:
          type: string
          format: uri

    PublicSubscriptionCreateRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        phoneE164:
          type: string
          description: Optional; normalized to E.164 on the server when provided
        smsOptIn:
          type: boolean
          description: >-
            Required when preference is sms or both. Records server-side SMS consent when true.
        organizationId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        preference:
          type: string
          enum: [email, sms, both]
          default: email

    PublicSubscriptionCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        viewerId:
          type: string
          format: uuid
        confirmed:
          type: boolean

    # Checkout Response
    CheckoutCreateResponse:
      type: object
      required:
        - purchaseId
        - checkoutUrl
      properties:
        purchaseId:
          type: string
          format: uuid
        checkoutUrl:
          type: string
          format: uri
          description: Square checkout URL

    # Purchase Payment Processing
    PurchaseProcessRequest:
      type: object
      required:
        - sourceId
      properties:
        sourceId:
          type: string
          description: Square Web Payments SDK source ID (nonce/token)

    PurchaseProcessResponse:
      type: object
      required:
        - purchaseId
        - status
      properties:
        purchaseId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - created
            - paid
            - failed
            - refunded
            - partially_refunded
        entitlementToken:
          type: string
          description: Present when status is paid; used to access watch bootstrap.

    PurchaseStatusResponse:
      type: object
      required:
        - purchaseId
        - status
      properties:
        purchaseId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - created
            - paid
            - failed
            - refunded
            - partially_refunded
        entitlementToken:
          type: string
          description: Present when a valid entitlement exists for this purchase.
        watchUrl:
          type: string
          format: uri
          description: Watch link for this purchase (`/direct/{slug}` for DirectStream, `/stream/{token}` for games).

    # Admin Auth
    AdminLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        mfaToken:
          type: string
          description: Optional 6-digit TOTP token (required when MFA enabled)

    AdminAccount:
      type: object
      required:
        - id
        - email
        - role
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - support_admin
            - super_admin

    AdminLoginResponse:
      type: object
      required:
        - adminAccount
        - sessionToken
        - mfaRequired
      properties:
        adminAccount:
          $ref: '#/components/schemas/AdminAccount'
        sessionToken:
          type: string
          description: Admin session token (sent as bearer or cookie depending on deployment)
        mfaRequired:
          type: boolean

    AdminMfaSetupResponse:
      type: object
      required:
        - secret
        - qrCodeUrl
      properties:
        secret:
          type: string
          description: Base32 TOTP secret
        qrCodeUrl:
          type: string
          description: Data URL for QR code image

    AdminMfaVerifyRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 6
          maxLength: 6

    AdminMfaVerifyResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean

    # Admin Purchase Timeline (minimal contract; can be expanded)
    AdminPurchaseTimelineResponse:
      type: object
      required:
        - purchaseId
        - purchase
        - events
      properties:
        purchaseId:
          type: string
          format: uuid
        purchase:
          type: object
          required:
            - id
            - gameId
            - gameTitle
            - viewerId
            - viewerEmail
            - amountCents
            - status
            - createdAt
          properties:
            id:
              type: string
              format: uuid
            gameId:
              type: string
              format: uuid
            gameTitle:
              type: string
            viewerId:
              type: string
              format: uuid
            viewerEmail:
              type: string
              description: Full email for SuperAdmin, masked for SupportAdmin
            viewerEmailMasked:
              type: string
            amountCents:
              type: integer
            status:
              type: string
            createdAt:
              type: string
              format: date-time
            paidAt:
              type: string
              format: date-time
        events:
          type: array
          items:
            type: object
            required:
              - type
              - timestamp
              - description
            properties:
              type:
                type: string
              timestamp:
                type: string
                format: date-time
              description:
                type: string
              metadata:
                type: object
                additionalProperties: true

    AdminGameAudienceResponse:
      type: object
      required:
        - gameId
        - purchasers
        - watchers
        - purchaseToWatchConversionRate
      properties:
        gameId:
          type: string
          format: uuid
        purchasers:
          type: array
          items:
            type: object
            required:
              - purchaseId
              - emailMasked
              - purchasedAt
              - amountCents
              - watched
            properties:
              purchaseId:
                type: string
                format: uuid
              emailMasked:
                type: string
                description: Masked email for SupportAdmin; may be full email for SuperAdmin
              purchasedAt:
                type: string
                format: date-time
              amountCents:
                type: integer
              watched:
                type: boolean
        watchers:
          type: array
          items:
            type: object
            required:
              - purchaseId
              - emailMasked
              - sessionCount
            properties:
              purchaseId:
                type: string
                format: uuid
              emailMasked:
                type: string
              sessionCount:
                type: integer
              lastWatchedAt:
                type: string
                format: date-time
              totalWatchMs:
                type: integer
        purchaseToWatchConversionRate:
          type: number
          minimum: 0
          maximum: 1

    # Watch Bootstrap Response
    WatchBootstrapResponse:
      type: object
      required:
        - streamUrl
        - playerType
        - state
        - validTo
        - gameInfo
      properties:
        streamUrl:
          type: string
          format: uri
        playerType:
          type: string
          enum:
            - hls
            - embed
        state:
          type: string
          enum:
            - not_started
            - live
            - ended
            - unavailable
        validTo:
          type: string
          format: date-time
        gameInfo:
          type: object
          properties:
            title:
              type: string
            startsAt:
              type: string
              format: date-time
        protectionLevel:
          type: string
          enum:
            - strong
            - moderate
            - best_effort

    # Watch Sessions & Telemetry
    WatchCreateSessionRequest:
      type: object
      properties:
        metadata:
          type: object
          additionalProperties: true
          description: Optional client metadata (device, player version, etc.)

    WatchCreateSessionResponse:
      type: object
      required:
        - sessionId
        - startedAt
      properties:
        sessionId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time

    TelemetryEvent:
      type: object
      required:
        - type
        - timestamp
      properties:
        type:
          type: string
          enum:
            - buffer
            - error
            - play
            - pause
            - seek
            - quality_change
        timestamp:
          type: integer
          description: Unix epoch timestamp in milliseconds
        duration:
          type: integer
          minimum: 0
          description: Optional duration in milliseconds (when applicable)
        errorCode:
          type: string
        errorMessage:
          type: string
        metadata:
          type: object
          additionalProperties: true

    WatchSubmitTelemetryRequest:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TelemetryEvent'

    WatchEndSessionRequest:
      type: object
      required:
        - totalWatchMs
        - totalBufferMs
        - bufferEvents
        - fatalErrors
      properties:
        totalWatchMs:
          type: integer
          minimum: 0
        totalBufferMs:
          type: integer
          minimum: 0
        bufferEvents:
          type: integer
          minimum: 0
        fatalErrors:
          type: integer
          minimum: 0
        startupLatencyMs:
          type: integer
          minimum: 0
        streamDownMs:
          type: integer
          minimum: 0

    WatchEndSessionResponse:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
          format: uuid
        endedAt:
          type: string
          format: date-time
        totalWatchMs:
          type: integer
        totalBufferMs:
          type: integer
        bufferEvents:
          type: integer
        fatalErrors:
          type: integer

    # Owner text commands (each owner login keeps a list of phones; one phone may work with several accounts)
    CoachTextCommandHelp:
      type: object
      required:
        - word
        - description
      properties:
        word:
          type: string
          maxLength: 20
          description: The word to text
        description:
          type: string
          maxLength: 200
          description: What the command does

    CoachTextPhoneStatus:
      type: object
      required:
        - id
        - label
        - phoneMasked
        - state
        - codeExpiresAt
        - verifiedAt
        - lastCommandAt
        - unverifiedTextSeen
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          description: The person's name, e.g. Jordan
        phoneMasked:
          type: string
          description: The number, masked. The full number is never returned.
          example: '(***) ***-0142'
        state:
          type: string
          enum:
            - pending
            - linked
            - paused
            - expired
          description: |
            How this phone stands.
            - `pending`: added, waiting for its `LINK` text (`codeExpiresAt` says until when; a past time means ask for a new code)
            - `linked`: the phone can text commands
            - `paused`: the phone texted STOP; texting START turns it back on
            - `expired`: the phone has not texted for too long; a new code proves it again
        codeExpiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the waiting code stops working. The code itself is never returned here.
        verifiedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the phone was linked
        lastCommandAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the phone last texted
        unverifiedTextSeen:
          type: boolean
          description: A text arrived from this number while its code waited but could not be verified

    CoachTextStatus:
      type: object
      required:
        - enabled
        - productNumber
        - timeZone
        - maxPhones
        - phones
        - commands
      properties:
        enabled:
          type: boolean
          description: False when text commands are not turned on for this account. `phones` is then empty.
        productNumber:
          type: string
          description: The number to text (E.164)
          example: '+18773435308'
        timeZone:
          type: string
          description: IANA time zone used to read and show times
          example: America/Chicago
        maxPhones:
          type: integer
          description: How many phones a login can list
          example: 10
        phones:
          type: array
          description: This login's phones, oldest first. Whether another account uses a number is never shown.
          items:
            $ref: '#/components/schemas/CoachTextPhoneStatus'
        commands:
          type: array
          description: The commands the phones can text, in the order the portal shows them. Empty while text commands are not turned on for the account.
          items:
            $ref: '#/components/schemas/CoachTextCommandHelp'

    AddCoachTextPhoneRequest:
      type: object
      required:
        - label
        - phone
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: The person's name, shown in the portal, the history and the emails
          example: Jordan
        phone:
          type: string
          minLength: 1
          maxLength: 32
          description: A US or Canadian mobile number, in any common form
          example: '214-555-0142'

    CoachTextPhoneCode:
      type: object
      required:
        - id
        - code
        - codeExpiresAt
        - productNumber
        - smsHref
      properties:
        id:
          type: string
          format: uuid
          description: The phone's row on the login's list
        code:
          type: string
          pattern: '^\d{6}$'
          description: The link code. Returned this once and never again.
          example: '482913'
        codeExpiresAt:
          type: string
          format: date-time
        productNumber:
          type: string
          description: The number to text the code to (E.164)
          example: '+18773435308'
        smsHref:
          type: string
          description: A link that opens the phone's messages app with the text filled in
          example: 'sms:+18773435308?&body=LINK%20482913'

    UpdateCoachTextSettingsRequest:
      type: object
      required:
        - timeZone
      properties:
        timeZone:
          type: string
          maxLength: 64
          description: IANA time zone
          example: America/Denver

    CoachTextPhoneRemoved:
      type: object
      required:
        - removed
      properties:
        removed:
          type: boolean
          const: true

    CoachTextHistoryItem:
      type: object
      required:
        - createdAt
        - body
        - status
        - replyText
        - phoneLabel
      properties:
        phoneLabel:
          type:
            - string
            - 'null'
          description: The name of the phone that sent the text, as it was then
        createdAt:
          type: string
          format: date-time
        body:
          type: string
          description: What the phone texted. A link code is stored as `LINK ******`.
        status:
          type: string
          description: What came of the text, for example `received`, `done`, `rejected` or `failed`
        replyText:
          type:
            - string
            - 'null'
          description: The reply that was sent, when there was one

    CoachTextHistory:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CoachTextHistoryItem'

    # Error Response
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
