components:
  schemas:
    # Viewer Identity (Email Required)
    ViewerIdentity:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Required for viewer identity and monitoring
        phoneE164:
          type: string
          pattern: '^\+[1-9]\d{1,14}$'
          description: Optional, E.164 format
        smsOptOut:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time

    # Stream Source (New - supports any media stream)
    StreamSource:
      type: object
      required:
        - type
        - gameId
        - protectionLevel
      properties:
        id:
          type: string
          format: uuid
        gameId:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - mux_managed
            - byo_hls
            - byo_rtmp
            - external_embed
        protectionLevel:
          type: string
          enum:
            - strong
            - moderate
            - best_effort
          description: Protection guarantee level
        muxAssetId:
          type: string
          description: For mux_managed type
        muxPlaybackId:
          type: string
          description: For mux_managed type
        hlsManifestUrl:
          type: string
          format: uri
          description: For byo_hls type
        rtmpPublishUrl:
          type: string
          format: uri
          description: For byo_rtmp type
        externalEmbedUrl:
          type: string
          format: uri
          description: For external_embed type (YouTube/Twitch/Vimeo)
        externalProvider:
          type: string
          enum:
            - youtube
            - twitch
            - vimeo
            - other
          description: For external_embed type
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Game
    Game:
      type: object
      required:
        - id
        - ownerAccountId
        - title
        - homeTeam
        - awayTeam
        - startsAt
        - priceCents
        - currency
        - state
        - keywordCode
      properties:
        id:
          type: string
          format: uuid
        ownerAccountId:
          type: string
          format: uuid
        title:
          type: string
        homeTeam:
          type: string
        awayTeam:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        state:
          type: string
          enum:
            - draft
            - active
            - live
            - ended
            - cancelled
        priceCents:
          type: integer
          minimum: 0
        currency:
          type: string
          default: USD
        keywordCode:
          type: string
        qrUrl:
          type: string
          format: uri
        streamSourceId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Purchase
    Purchase:
      type: object
      required:
        - id
        - gameId
        - viewerId
        - amountCents
        - currency
        - status
      properties:
        id:
          type: string
          format: uuid
        gameId:
          type: string
          format: uuid
        viewerId:
          type: string
          format: uuid
        amountCents:
          type: integer
        currency:
          type: string
        platformFeeCents:
          type: integer
        processorFeeCents:
          type: integer
        ownerNetCents:
          type: integer
        status:
          type: string
          enum:
            - created
            - paid
            - failed
            - refunded
            - partially_refunded
        paymentProviderPaymentId:
          type: string
        createdAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time

    # Checkout Request (Email Required)
    CheckoutCreateRequest:
      type: object
      required:
        - viewerEmail
      properties:
        viewerEmail:
          type: string
          format: email
          description: Required for viewer identity and monitoring
        viewerPhone:
          type: string
          pattern: '^\+[1-9]\d{1,14}$'
          description: Optional, E.164 format
        returnUrl:
          type: string
          format: uri

    # Checkout Response
    CheckoutCreateResponse:
      type: object
      required:
        - purchaseId
        - checkoutUrl
      properties:
        purchaseId:
          type: string
          format: uuid
        checkoutUrl:
          type: string
          format: uri
          description: Square checkout URL

    # Purchase Payment Processing
    PurchaseProcessRequest:
      type: object
      required:
        - sourceId
      properties:
        sourceId:
          type: string
          description: Square Web Payments SDK source ID (nonce/token)

    PurchaseProcessResponse:
      type: object
      required:
        - purchaseId
        - status
      properties:
        purchaseId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - created
            - paid
            - failed
            - refunded
            - partially_refunded
        entitlementToken:
          type: string
          description: Present when status is paid; used to access watch bootstrap.

    PurchaseStatusResponse:
      type: object
      required:
        - purchaseId
        - status
      properties:
        purchaseId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - created
            - paid
            - failed
            - refunded
            - partially_refunded
        entitlementToken:
          type: string
          description: Present when a valid entitlement exists for this purchase.

    # Admin Auth
    AdminLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        mfaToken:
          type: string
          description: Optional 6-digit TOTP token (required when MFA enabled)

    AdminAccount:
      type: object
      required:
        - id
        - email
        - role
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - support_admin
            - super_admin

    AdminLoginResponse:
      type: object
      required:
        - adminAccount
        - sessionToken
        - mfaRequired
      properties:
        adminAccount:
          $ref: '#/components/schemas/AdminAccount'
        sessionToken:
          type: string
          description: Admin session token (sent as bearer or cookie depending on deployment)
        mfaRequired:
          type: boolean

    AdminMfaSetupResponse:
      type: object
      required:
        - secret
        - qrCodeUrl
      properties:
        secret:
          type: string
          description: Base32 TOTP secret
        qrCodeUrl:
          type: string
          description: Data URL for QR code image

    AdminMfaVerifyRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 6
          maxLength: 6

    AdminMfaVerifyResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean

    # Admin Purchase Timeline (minimal contract; can be expanded)
    AdminPurchaseTimelineResponse:
      type: object
      required:
        - purchaseId
        - purchase
        - events
      properties:
        purchaseId:
          type: string
          format: uuid
        purchase:
          type: object
          required:
            - id
            - gameId
            - gameTitle
            - viewerId
            - viewerEmail
            - amountCents
            - status
            - createdAt
          properties:
            id:
              type: string
              format: uuid
            gameId:
              type: string
              format: uuid
            gameTitle:
              type: string
            viewerId:
              type: string
              format: uuid
            viewerEmail:
              type: string
              description: Full email for SuperAdmin, masked for SupportAdmin
            viewerEmailMasked:
              type: string
            amountCents:
              type: integer
            status:
              type: string
            createdAt:
              type: string
              format: date-time
            paidAt:
              type: string
              format: date-time
        events:
          type: array
          items:
            type: object
            required:
              - type
              - timestamp
              - description
            properties:
              type:
                type: string
              timestamp:
                type: string
                format: date-time
              description:
                type: string
              metadata:
                type: object
                additionalProperties: true

    AdminGameAudienceResponse:
      type: object
      required:
        - gameId
        - purchasers
        - watchers
        - purchaseToWatchConversionRate
      properties:
        gameId:
          type: string
          format: uuid
        purchasers:
          type: array
          items:
            type: object
            required:
              - purchaseId
              - emailMasked
              - purchasedAt
              - amountCents
              - watched
            properties:
              purchaseId:
                type: string
                format: uuid
              emailMasked:
                type: string
                description: Masked email for SupportAdmin; may be full email for SuperAdmin
              purchasedAt:
                type: string
                format: date-time
              amountCents:
                type: integer
              watched:
                type: boolean
        watchers:
          type: array
          items:
            type: object
            required:
              - purchaseId
              - emailMasked
              - sessionCount
            properties:
              purchaseId:
                type: string
                format: uuid
              emailMasked:
                type: string
              sessionCount:
                type: integer
              lastWatchedAt:
                type: string
                format: date-time
              totalWatchMs:
                type: integer
        purchaseToWatchConversionRate:
          type: number
          minimum: 0
          maximum: 1

    # Watch Bootstrap Response
    WatchBootstrapResponse:
      type: object
      required:
        - streamUrl
        - playerType
        - state
        - validTo
        - gameInfo
      properties:
        streamUrl:
          type: string
          format: uri
        playerType:
          type: string
          enum:
            - hls
            - embed
        state:
          type: string
          enum:
            - not_started
            - live
            - ended
            - unavailable
        validTo:
          type: string
          format: date-time
        gameInfo:
          type: object
          properties:
            title:
              type: string
            startsAt:
              type: string
              format: date-time
        protectionLevel:
          type: string
          enum:
            - strong
            - moderate
            - best_effort

    # Watch Sessions & Telemetry
    WatchCreateSessionRequest:
      type: object
      properties:
        metadata:
          type: object
          additionalProperties: true
          description: Optional client metadata (device, player version, etc.)

    WatchCreateSessionResponse:
      type: object
      required:
        - sessionId
        - startedAt
      properties:
        sessionId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time

    TelemetryEvent:
      type: object
      required:
        - type
        - timestamp
      properties:
        type:
          type: string
          enum:
            - buffer
            - error
            - play
            - pause
            - seek
            - quality_change
        timestamp:
          type: integer
          description: Unix epoch timestamp in milliseconds
        duration:
          type: integer
          minimum: 0
          description: Optional duration in milliseconds (when applicable)
        errorCode:
          type: string
        errorMessage:
          type: string
        metadata:
          type: object
          additionalProperties: true

    WatchSubmitTelemetryRequest:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TelemetryEvent'

    WatchEndSessionRequest:
      type: object
      required:
        - totalWatchMs
        - totalBufferMs
        - bufferEvents
        - fatalErrors
      properties:
        totalWatchMs:
          type: integer
          minimum: 0
        totalBufferMs:
          type: integer
          minimum: 0
        bufferEvents:
          type: integer
          minimum: 0
        fatalErrors:
          type: integer
          minimum: 0
        startupLatencyMs:
          type: integer
          minimum: 0
        streamDownMs:
          type: integer
          minimum: 0

    WatchEndSessionResponse:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
          format: uuid
        endedAt:
          type: string
          format: date-time
        totalWatchMs:
          type: integer
        totalBufferMs:
          type: integer
        bufferEvents:
          type: integer
        fatalErrors:
          type: integer

    # Watch Links (Org/Team Stable URLs)
    WatchLinkResolveResponse:
      type: object
      required:
        - accessMode
        - orgShortName
        - teamSlug
      properties:
        accessMode:
          type: string
          enum:
            - public_free
            - pay_per_view
          description: Access mode determines if payment is required
        orgShortName:
          type: string
        teamSlug:
          type: string
        playerType:
          type: string
          enum:
            - hls
            - embed
          description: Present when accessMode is public_free
        streamUrl:
          type: string
          format: uri
          description: Present when accessMode is public_free
        priceCents:
          type: integer
          minimum: 0
          description: Present when accessMode is pay_per_view
        currency:
          type: string
          default: USD
          description: Present when accessMode is pay_per_view
        checkoutRequired:
          type: boolean
          description: Present when accessMode is pay_per_view; true if payment needed

    WatchLinkCheckoutRequest:
      type: object
      required:
        - viewerEmail
      properties:
        viewerEmail:
          type: string
          format: email
          description: Required for viewer identity and monitoring
        viewerPhone:
          type: string
          pattern: '^\+[1-9]\d{1,14}$'
          description: Optional, E.164 format
        code:
          type: string
          minLength: 4
          maxLength: 32
          pattern: '^[A-Za-z0-9]+$'
          description: Optional event code
        returnUrl:
          type: string
          format: uri
          description: Optional return URL after payment

    WatchLinkCheckoutResponse:
      type: object
      required:
        - purchaseId
        - checkoutUrl
      properties:
        purchaseId:
          type: string
          format: uuid
        checkoutUrl:
          type: string
          format: uri
          description: Square checkout URL

    CreateWatchOrgRequest:
      type: object
      required:
        - shortName
        - name
      properties:
        shortName:
          type: string
          minLength: 2
          maxLength: 20
          pattern: '^[A-Z0-9]+$'
          description: Uppercase alphanumeric, unique
        name:
          type: string
          minLength: 1
          maxLength: 120

    WatchOrgResponse:
      type: object
      required:
        - id
        - shortName
        - name
        - ownerAccountId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        shortName:
          type: string
        name:
          type: string
        ownerAccountId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateWatchChannelRequest:
      type: object
      required:
        - teamSlug
        - displayName
        - accessMode
        - streamType
      properties:
        teamSlug:
          type: string
          minLength: 2
          maxLength: 40
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        accessMode:
          type: string
          enum:
            - public_free
            - pay_per_view
        priceCents:
          type: integer
          minimum: 0
          description: Required when accessMode is pay_per_view
        currency:
          type: string
          default: USD
          description: Required when accessMode is pay_per_view
        requireEventCode:
          type: boolean
          default: false
        streamType:
          type: string
          enum:
            - mux_playback
            - byo_hls
            - external_embed
        muxPlaybackId:
          type: string
          description: Required when streamType is mux_playback
        hlsManifestUrl:
          type: string
          format: uri
          description: Required when streamType is byo_hls
        externalEmbedUrl:
          type: string
          format: uri
          description: Required when streamType is external_embed
        externalProvider:
          type: string
          enum:
            - youtube
            - twitch
            - vimeo
            - other
          description: Required when streamType is external_embed

    UpdateWatchChannelRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        accessMode:
          type: string
          enum:
            - public_free
            - pay_per_view
        priceCents:
          type: integer
          minimum: 0
        currency:
          type: string
        requireEventCode:
          type: boolean
        streamType:
          type: string
          enum:
            - mux_playback
            - byo_hls
            - external_embed
        muxPlaybackId:
          type: string
        hlsManifestUrl:
          type: string
          format: uri
        externalEmbedUrl:
          type: string
          format: uri
        externalProvider:
          type: string
          enum:
            - youtube
            - twitch
            - vimeo
            - other

    WatchChannelResponse:
      type: object
      required:
        - id
        - organizationId
        - teamSlug
        - displayName
        - accessMode
        - streamType
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        teamSlug:
          type: string
        displayName:
          type: string
        accessMode:
          type: string
          enum:
            - public_free
            - pay_per_view
        priceCents:
          type: integer
          nullable: true
        currency:
          type: string
          nullable: true
        requireEventCode:
          type: boolean
        streamType:
          type: string
          enum:
            - mux_playback
            - byo_hls
            - external_embed
        muxPlaybackId:
          type: string
          nullable: true
        hlsManifestUrl:
          type: string
          format: uri
          nullable: true
        externalEmbedUrl:
          type: string
          format: uri
          nullable: true
        externalProvider:
          type: string
          enum:
            - youtube
            - twitch
            - vimeo
            - other
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateWatchEventCodeRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 32
          pattern: '^[A-Za-z0-9]+$'

    WatchEventCodeResponse:
      type: object
      required:
        - id
        - channelId
        - code
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        code:
          type: string
        status:
          type: string
          enum:
            - active
            - disabled
        boundIpHash:
          type: string
          nullable: true
        boundAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Error Response
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
